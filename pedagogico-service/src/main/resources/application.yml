spring:
    application:
        name: sabia-pedagogico-service
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}
    datasource:
        url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5433/sabia?currentSchema=pedagogico}}
        username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:sabia}}
        password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASS:sabia}}
        driver-class-name: org.postgresql.Driver
    rabbitmq:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_PORT:5672}
        username: ${RABBITMQ_USER:sabia}
        password: ${RABBITMQ_PASS:sabia}
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                "[format_sql]": true
    web:
        error:
            include-message: always

server:
    port: ${SERVER_PORT:8081}

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
        operationsSorter: alpha

sabia:
    jwt:
        secret: ${JWT_SECRET:dev-secret-change-in-production-must-be-at-least-32-chars}
        expiration-ms: ${JWT_EXPIRATION_MS:28800000}
    cors:
        allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
    mensageria:
        # false: não conecta nem declara topologia no RabbitMQ (ele ainda não é usado
        # por nenhum fluxo); em prod dispensa RABBITMQ_PASS.
        rabbitmq-enabled: ${RABBITMQ_ENABLED:true}
        correcoes:
            exchange: sabia.correcoes.exchange
            fila: sabia.correcoes.solicitadas.queue
            routing-key: correcao.solicitada
