spring:
    application:
        name: sabia-pedagogico-service
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}
    datasource:
        url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5433/sabia?currentSchema=pedagogico}}
        username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:sabia}}
        password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASS:sabia}}
        driver-class-name: org.postgresql.Driver
    rabbitmq:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_PORT:5672}
        username: ${RABBITMQ_USER:sabia}
        password: ${RABBITMQ_PASS:sabia}
        connection-timeout: 5s
        publisher-confirm-type: correlated
        publisher-returns: true
        template:
            mandatory: true
        listener:
            simple:
                # Falha no consumidor: 3 tentativas com backoff; esgotadas, a mensagem vai para a DLQ.
                default-requeue-rejected: false
                prefetch: 10
                retry:
                    enabled: true
                    max-attempts: ${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
                    initial-interval: ${RABBITMQ_RETRY_INITIAL_INTERVAL:1s}
                    multiplier: 2
                    max-interval: 10s
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                "[format_sql]": true
    web:
        error:
            include-message: always

server:
    port: ${SERVER_PORT:8081}

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
        operationsSorter: alpha

sabia:
    jwt:
        secret: ${JWT_SECRET:dev-secret-change-in-production-must-be-at-least-32-chars}
        expiration-ms: ${JWT_EXPIRATION_MS:28800000}
    cors:
        allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
    mensageria:
        # false: não conecta no RabbitMQ, não declara topologia, não consome nem publica eventos;
        # em prod dispensa RABBITMQ_PASS.
        rabbitmq-enabled: ${RABBITMQ_ENABLED:true}
