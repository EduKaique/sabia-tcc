spring:
    application:
        name: sabia-pedagogico-service
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5433/academico}
        username: ${DB_USER:academico}
        password: ${DB_PASS:academico}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                "[format_sql]": true
    web:
        error:
            include-message: always

server:
    port: 8082

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
        operationsSorter: alpha

sabia:
    jwt:
        secret: ${JWT_SECRET:dev-secret-change-in-production-must-be-at-least-32-chars}
        expiration-ms: ${JWT_EXPIRATION_MS:28800000}
    cors:
        allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
    ia:
        gemini:
            api-key: ${GEMINI_API_KEY:}
            model: gemini-2.5-flash
