name: Publicar imagens (GHCR)

on:
  push:
    branches: [release, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (${{ matrix.servico }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        servico: [auth-service, pedagogico-service]
    defaults:
      run:
        working-directory: ${{ matrix.servico }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.servico }}/pom.xml

      - name: mvn test
        run: |
          chmod +x mvnw
          ./mvnw -B test

  testes-ia:
    name: Testes (ia-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ia-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ia-service/requirements.txt
            ia-service/requirements-dev.txt

      - name: pytest
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest

  publicar:
    name: Imagem ${{ matrix.imagem }}
    needs: [testes, testes-ia]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - imagem: web
            contexto: web
            alvo: runner
          - imagem: api-gateway
            contexto: api-gateway
            alvo: runner
          - imagem: auth-service
            contexto: auth-service
            alvo: runner
          - imagem: pedagogico-service
            contexto: pedagogico-service
            alvo: runner
          - imagem: ia-service
            contexto: ia-service
            alvo: ""
    steps:
      - uses: actions/checkout@v4

      # O GHCR exige o nome do owner em minúsculas.
      - name: Nome da imagem
        id: nome
        run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sabia-${{ matrix.imagem }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nome.outputs.imagem }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          target: ${{ matrix.alvo }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.imagem }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagem }}
