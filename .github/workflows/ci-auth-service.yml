name: CI — Auth Service (Spring Boot)

on:
  push:
    branches: [main, develop]
    paths:
      - "auth-service/**"
      - ".github/workflows/ci-auth-service.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "auth-service/**"
      - ".github/workflows/ci-auth-service.yml"

defaults:
  run:
    working-directory: auth-service

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Verify mvnw permissions
        run: chmod +x ./mvnw

      - name: Build & Test
        run: ./mvnw verify
        env:
          SPRING_PROFILES_ACTIVE: test
