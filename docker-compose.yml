services:
  db:
    image: postgres:16-alpine
    container_name: sabia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sabia
      POSTGRES_USER: sabia
      POSTGRES_PASSWORD: sabia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabia"]
      interval: 10s
      timeout: 5s
      retries: 5

  academico-db:
    image: postgres:16-alpine
    container_name: sabia_academico_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: academico
      POSTGRES_USER: academico
      POSTGRES_PASSWORD: academico
    ports:
      - "5433:5432"
    volumes:
      - academico_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academico"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:16-alpine
    container_name: sabia_auth_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sabia_auth
      POSTGRES_USER: sabia
      POSTGRES_PASSWORD: sabia
    ports:
      - "5434:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabia"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: sabia_auth_service
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/sabia_auth
      SPRING_DATASOURCE_USERNAME: sabia
      SPRING_DATASOURCE_PASSWORD: sabia
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-must-be-at-least-32-chars}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-dev}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@sabia.edu}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "8080:8080"

  pedagogico-service:
    build:
      context: ./pedagogico-service
      dockerfile: Dockerfile
    container_name: sabia_pedagogico_service
    restart: unless-stopped
    depends_on:
      academico-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://academico-db:5432/academico
      SPRING_DATASOURCE_USERNAME: academico
      SPRING_DATASOURCE_PASSWORD: academico
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8081
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8081:8081"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    container_name: sabia_web
    restart: unless-stopped
    depends_on:
      - api-gateway
      - auth-service
      - pedagogico-service
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_PEDAGOGICO_API_URL: http://localhost:8000/api/pedagogico
    ports:
      - "3000:3000"

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: sabia_api_gateway
    restart: unless-stopped
    environment:
      GATEWAY_PORT: 8000
      AUTH_URL: http://auth-service:8080
      PEDAGOGICO_URL: http://pedagogico-service:8081
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-must-be-at-least-32-chars}
    ports:
      - "8000:8000"
    depends_on:
      auth-service:
        condition: service_started
      pedagogico-service:
        condition: service_started


volumes:
  postgres_data:
  academico_postgres_data:
  auth_postgres_data:
