services:
  database:
    image: postgres:16-alpine
    container_name: sabia_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: sabia
      POSTGRES_USER: sabia
      POSTGRES_PASSWORD: sabia
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabia -d sabia"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sabia_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: sabia
      RABBITMQ_DEFAULT_PASS: sabia
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: sabia_auth_service
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/sabia?currentSchema=auth
      SPRING_DATASOURCE_USERNAME: sabia
      SPRING_DATASOURCE_PASSWORD: sabia
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-must-be-at-least-32-chars}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-dev}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@sabia.edu}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "8080:8080"

  pedagogico-service:
    build:
      context: ./pedagogico-service
      dockerfile: Dockerfile
    container_name: sabia_pedagogico_service
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/sabia?currentSchema=pedagogico
      SPRING_DATASOURCE_USERNAME: sabia
      SPRING_DATASOURCE_PASSWORD: sabia
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8081
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8081:8081"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    container_name: sabia_web
    restart: unless-stopped
    depends_on:
      - api-gateway
      - auth-service
      - pedagogico-service
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_PEDAGOGICO_API_URL: ${NEXT_PUBLIC_PEDAGOGICO_API_URL:-http://localhost:8000/api/pedagogico}
    ports:
      - "3000:3000"

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: sabia_api_gateway
    restart: unless-stopped
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-8000}
      AUTH_URL: ${AUTH_URL:-http://auth-service:8080}
      PEDAGOGICO_URL: ${PEDAGOGICO_URL:-http://pedagogico-service:8081}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-must-be-at-least-32-chars}
    ports:
      - "8000:8000"
    depends_on:
      auth-service:
        condition: service_started
      pedagogico-service:
        condition: service_started


volumes:
  postgres_data:
  rabbitmq_data:
