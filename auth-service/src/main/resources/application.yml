spring:
    application:
        name: sabia-auth-service
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}
    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sabia_auth}
        username: ${SPRING_DATASOURCE_USERNAME:sabia}
        password: ${SPRING_DATASOURCE_PASSWORD:sabia}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                "[format_sql]": true
    web:
        error:
            include-message: always

server:
    port: ${SERVER_PORT:8081}

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
        operationsSorter: alpha

sabia:
    jwt:
        # Segredo HMAC compartilhado com o API Gateway e os demais serviços.
        # O auth-service é o ÚNICO emissor; os outros apenas validam com este segredo.
        secret: ${JWT_SECRET:dev-secret-change-in-production-must-be-at-least-32-chars}
        expiration-ms: ${JWT_EXPIRATION_MS:28800000}
    cors:
        allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
    frontend:
        recuperar-senha-url: ${FRONTEND_RECUPERAR_SENHA_URL:http://localhost:3000/recuperar-senha}
    email:
        # Provedor do EmailService: "dev" apenas loga o link (padrão); trocar por
        # um provedor SMTP real quando houver implementação.
        provider: ${EMAIL_PROVIDER:dev}
