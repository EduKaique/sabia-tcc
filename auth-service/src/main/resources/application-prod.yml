# Profile de produção. Ativar com SPRING_PROFILES_ACTIVE=prod.
# Segredos sem default: sem eles a aplicação não sobe.
spring:
  datasource:
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASS}}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false
        # Cria o schema na primeira subida (não depende de database/init/01-init.sql).
        # Só tem efeito com ddl-auto create/update.
        default_schema: ${DB_SCHEMA:auth}
        hbm2ddl:
          create_namespaces: true
  sql:
    init:
      mode: never
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-exception: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.sabia: INFO

sabia:
  jwt:
    secret: ${JWT_SECRET}
