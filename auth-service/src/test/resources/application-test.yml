spring:
  datasource:
    url: jdbc:h2:mem:sabia_auth_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

sabia:
  login:
    # Alto nos testes: as falhas de login de várias classes se somam no contexto compartilhado.
    # O limite é testado em LoginLimiteTentativasTest, com valor próprio.
    max-falhas: 1000
  mensageria:
    rabbitmq-enabled: false
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:3000
  pedagogico:
    url: http://localhost:0
